const AI_SCHEMA='{"meta":{"proj":"","owner":"","area":0,"bL":0,"bW":0,"bH":0},"exc":[{"name":"","L":0,"W":0,"D":0,"N":1}],"con":[{"name":"","type":"قاعدة|لبشة/شداد|رقبة عمود|خرسانة عادية|عمود|جدار قص|كمرة|سقف مصمت|فلات سلاب|سقف هوردي","grade":"17|21|25|28|30|35","L":0,"W":0,"H":0,"N":1}],"reb":[{"el":"","dia":"8|10|12|14|16|18|20|25|32","len":0,"n":0,"cnt":1}],"wall":[{"name":"","L":0,"H":0,"th":"10|15|20","N":1}],"open":[{"name":"","W":0,"H":0,"N":1}],"fin":[{"name":"","type":"'+FT.join('|')+'","L":0,"W":0,"N":1,"ded":0}],"notes":""}';
const AI_PROMPT='حلل المخطط المرفق (معماري/إنشائي) واستخرج اسم المشروع وأبعاد المبنى (bL الطول وbW العرض وbH الارتفاع الكلي للمبنى بالمتر) وبيانات الحصر. أعد JSON فقط بدون أي شرح وبهذا الشكل بالضبط (الأبعاد بالمتر عدا السمك بالسم، والمساحة بالمتر المربع). ضع في notes أي افتراض أو بند غير واضح. لا تخترع قيما غير موجودة: إن لم تظهر في المخطط اتركها فارغة أو صفرا.\n'+AI_SCHEMA;
let AIF=null,AIP=null;
const aiSay=(who,t)=>{const c=$('#aiChat');if(!c)return;const d=document.createElement('div');d.style.cssText='margin:8px 0;padding:10px 12px;border-radius:12px;max-width:92%;white-space:pre-wrap;'+(who=='u'?'background:#0e749033;margin-right:0;margin-left:auto':'background:#5b21b633');d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight};
const aiNum=v=>{v=parseFloat(String(v).replace(/,/g,''));return isFinite(v)&&v>=0?v:0};
const aiPick=(v,list,def)=>list.map(String).includes(String(v))?(typeof list[0]=='number'?+v:String(v)):def;
const AIK={exc:['exc','excavation','excavations','حفر','الحفر'],con:['con','concrete','concretes','خرسانة','الخرسانة'],reb:['reb','rebar','rebars','steel','reinforcement','حديد','الحديد'],wall:['wall','walls','masonry','جدران','الجدران'],open:['open','openings','doors_windows','فتحات','الفتحات'],fin:['fin','finishes','finishing','finish','تشطيبات','التشطيبات'],meta:['meta','project','المشروع']};
function aiNorm(o){if(Array.isArray(o))o=o.find(x=>x&&typeof x=='object')||{};
 for(const w of ['data','result','output','project_data']){if(o&&o[w]&&typeof o[w]=='object'&&!Array.isArray(o[w])&&!o.meta&&!o.exc&&!o.con)o=o[w]}
 const R={};Object.keys(o||{}).forEach(k=>{const kk=k.toLowerCase().trim();const t=Object.keys(AIK).find(x=>AIK[x].includes(kk));R[t||k]=o[k]});return R}
function aiClean(o){o=aiNorm(o);
 const arr=k=>Array.isArray(o[k])?o[k]:[],R={meta:{},tb:{}},m=o.meta||{};
 if(m.proj)R.meta.proj=String(m.proj).slice(0,120);if(m.owner)R.meta.owner=String(m.owner).slice(0,120);['bL','bW','bH'].forEach(k=>{if(aiNum(m[k]))R.meta[k]=aiNum(m[k])});if(aiNum(m.area))R.meta.area=aiNum(m.area);else if(R.meta.bL&&R.meta.bW)R.meta.area=Math.round(R.meta.bL*R.meta.bW*100)/100;
 R.tb.exc=arr('exc').map(r=>({name:String(r.name||'ح'),L:aiNum(r.L),W:aiNum(r.W),D:aiNum(r.D),N:aiNum(r.N)||1}));
 R.tb.con=arr('con').map(r=>({name:String(r.name||''),type:aiPick(r.type,CT,'قاعدة'),grade:aiPick(r.grade,GR,'25'),L:aiNum(r.L),W:aiNum(r.W),H:aiNum(r.H),N:aiNum(r.N)||1}));
 R.tb.reb=arr('reb').map(r=>({el:String(r.el||''),dia:aiPick(r.dia,[8,10,12,14,16,18,20,25,32],12),len:aiNum(r.len),n:aiNum(r.n),cnt:aiNum(r.cnt)||1}));
 R.tb.wall=arr('wall').map(r=>({name:String(r.name||''),L:aiNum(r.L),H:aiNum(r.H),th:aiPick(r.th,[10,15,20],20),N:aiNum(r.N)||1}));
 R.tb.open=arr('open').map(r=>({name:String(r.name||''),W:aiNum(r.W),H:aiNum(r.H),N:aiNum(r.N)||1}));
 R.tb.fin=arr('fin').map(r=>({name:String(r.name||''),type:aiPick(r.type,FT,'لياسة داخلية'),L:aiNum(r.L),W:aiNum(r.W),N:aiNum(r.N)||1,ded:aiNum(r.ded)}));
 R.notes=String(o.notes||'').slice(0,1500);return R}
function aiParse(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('لم أجد بيانات JSON في الرد');return JSON.parse(t.slice(a,b+1))}
const AIN={exc:'الحفر',con:'الخرسانة',reb:'الحديد',wall:'الجدران',open:'الفتحات',fin:'التشطيبات'};
function aiPreview(raw){
 try{const o=typeof raw=='string'?aiParse(raw):raw;AIP=aiClean(o);
  const parts=Object.keys(AIN).filter(k=>AIP.tb[k].length).map(k=>`${AIN[k]}: ${AIP.tb[k].length} صف`);
  if(!parts.length&&!Object.keys(AIP.meta).length)throw new Error('الذكاء الاصطناعي لم يرجع بنودا قابلة للتطبيق (الرد فارغ أو بشكل غير متوقع). جرّب مخططا أوضح أو الوضع اليدوي');
  $('#aiPrev').innerHTML=`<div class="card" style="margin-top:12px"><h2>معاينة قبل التطبيق</h2><p>${esc(parts.join(' | ')||'بيانات المشروع فقط')}${Object.keys(AIP.meta).length?' | بيانات المشروع':''}</p>${Object.keys(AIP.meta).length?`<p>${esc(Object.entries(AIP.meta).map(([k,v])=>({proj:'المشروع',owner:'المالك',area:'المساحة م²',bL:'الطول م',bW:'العرض م',bH:'الارتفاع م'}[k]+': '+v)).join(' | '))}</p>`:''}${AIP.notes?`<p style="color:var(--go)">ملاحظات الذكاء الاصطناعي: ${esc(AIP.notes)}</p>`:''}<p style="color:var(--mu);font-size:13px">التطبيق يستبدل الجداول المذكورة فقط ويبقي الباقي. راجع الأرقام بعد التطبيق، فهي تقدير من المخطط.</p><button type="button" class="btn p" data-ai="apply">تطبيق على الجداول</button></div>`;
  return true}catch(e){AIP=null;$('#aiPrev').innerHTML='';aiSay('a','تعذر قراءة البيانات: '+e.message);return false}}
function aiApply(){if(!AIP)return;Object.assign(S.meta,AIP.meta);
 Object.keys(AIN).forEach(k=>{if(AIP.tb[k].length)S.tb[k]=AIP.tb[k]});
 const sm=Object.keys(AIN).filter(k=>AIP.tb[k].length).map(k=>AIN[k]+' '+AIP.tb[k].length).join('، ');Object.keys(AIN).forEach(renderT);bindMeta();calc();$('#aiPrev').innerHTML='';AIP=null;
 aiSay('a','تم تطبيق البيانات: '+(sm||'بيانات المشروع')+'. نقلتك إلى الجدول النهائي. راجع تبويبات الحفر والخرسانة والحديد والمباني والتشطيبات وأدخل الأسعار.');toast('تم تطبيق بيانات المخطط ✓');const nb=document.querySelector('[data-tab=boq]');if(nb)nb.click()}
function aiFile(f){AIF=null;$('#aiFn').textContent='';if(!f)return;
 if(f.type=='application/pdf'){if(f.size>3e6){aiSay('a','ملف PDF أكبر من 3 ميجا. صغّره أو ارفع صورة للمخطط.');return}
  const r=new FileReader();r.onload=()=>{AIF={mime:f.type,data:String(r.result).split(',')[1]};$('#aiFn').textContent='📄 '+f.name};r.readAsDataURL(f)}
 else if(f.type.startsWith('image/')){const img=new Image,u=URL.createObjectURL(f);img.onload=()=>{const k=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);AIF={mime:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]};$('#aiFn').textContent='🖼 '+f.name;URL.revokeObjectURL(u)};img.onerror=()=>aiSay('a','تعذر قراءة الصورة');img.src=u}
 else aiSay('a','الصيغ المدعومة: صورة أو PDF')}
async function aiSend(){const msg=$('#aiMsg').value.trim();if(!AIF&&!msg){aiSay('a','ارفع مخطط أو اكتب رسالة.');return}
 aiSay('u',(AIF?$('#aiFn').textContent+'\n':'')+(msg||'حلل المخطط'));$('#aiMsg').value='';const btn=$('[data-ai=send]');btn.disabled=true;aiSay('a','جاري التحليل...');
 try{const r=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,file:AIF,prompt:AI_PROMPT})});
  let j={};try{j=await r.json()}catch(x){}
  if(!r.ok){if(r.status==404)throw new Error('NOSERVER');throw new Error(({413:'الملف كبير على الخدمة. صغّر المخطط أو ارفع صورة.',429:'انتهى الحد المجاني حاليا. حاول لاحقا أو استخدم الوضع اليدوي.',504:'انتهت مهلة التحليل. جرّب صورة أصغر.',500:'خطأ في إعداد الخدمة: '+(j.error||'')}[r.status])||(j.error||'HTTP '+r.status))}
  if(j.reply)aiSay('a',j.reply);if(j.data)aiPreview(j.data);else aiSay('a','لم يرجع الذكاء الاصطناعي بيانات مقروءة. جرّب مرة أخرى أو الوضع اليدوي.');}
 catch(e){aiSay('a',e.message=='NOSERVER'||e instanceof TypeError?'خدمة التحليل غير مفعّلة بعد على هذا الموقع (تحتاج دالة خادم ومفتاح ذكاء اصطناعي). استخدم الوضع اليدوي أدناه: انسخ التعليمات، أعطها مع المخطط لأي ذكاء اصطناعي، والصق الرد هنا.':'تعذر التحليل: '+e.message)}
 btn.disabled=false}
document.addEventListener('change',e=>{if(e.target.id=='aiFile')aiFile(e.target.files[0])});
document.addEventListener('click',e=>{const b=e.target.closest('[data-ai]');if(!b)return;const a=b.dataset.ai;
 if(a=='send')aiSend();if(a=='apply')aiApply();
 if(a=='copy'){navigator.clipboard&&navigator.clipboard.writeText(AI_PROMPT).then(()=>toast('تم نسخ التعليمات ✓'),()=>toast('تعذر النسخ'))}
 if(a=='prev'){const t=$('#aiJson').value.trim();if(t)aiPreview(t)}});
aiSay('a','مرحبا. ارفع مخطط (صورة أو PDF) وأحلله وأعبي بيانات المشروع تلقائيا: الحفر والخرسانة والحديد والمباني والتشطيبات. بعدها تراجع وتطبق.');

const xe=s=>String(s).replace(/&quot;/g,'"').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const colL=i=>String.fromCharCode(65+i);
function zip(files){
 const te=new TextEncoder(),T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}
 const crc=b=>{let c=-1;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
 const parts=[],cd=[];let off=0;
 files.forEach(([name,str])=>{const nb=te.encode(name),d=te.encode(str),cr=crc(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x5821,true);h.setUint32(14,cr,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),nb,d);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x5821,true);c.setUint32(16,cr,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
  cd.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+d.length});
 const cs=cd.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function buildXlsx(TM){
 let rows='',mg=[],r=0;
 const cell=(c,v,k)=>{if(typeof v=='string'&&v!==''&&/^-?[\d,]*\.?\d+$/.test(v)&&!/^0\d/.test(v))v=Number(v.replace(/,/g,''));
  const n=typeof v=='number'&&isFinite(v),f=n&&!Number.isInteger(v),s=k=='t'?1:k=='h'?2:k=='b'?(n?(f?4:8):3):(n?(f?6:9):5),ref=colL(c)+r;
  return n?`<c r="${ref}" s="${s}"><v>${v}</v></c>`:(v===''||v==null)?`<c r="${ref}" s="${s}"/>`:`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`};
 const row=(a,k,h)=>{r++;rows+=`<row r="${r}"${h?` ht="${h}" customHeight="1"`:''}>${a.map((v,c)=>cell(c,v,k)).join('')}</row>`};
 TM.forEach(t=>{const w=t.head.length;row([t.title,...Array(w-1).fill('')],'t',26);if(w>1)mg.push(`A${r}:${colL(w-1)}${r}`);row(t.head,'h',22);t.rows.forEach(a=>row(a,'b'));if(t.foot)row(t.foot,'f');r++});
 row(['تصميم وبرمجة: م/عبدالرحمن عامر  |  للتواصل والاستشارات الهندسية والبرمجية: +967777136380','','','','',''],'f',24);mg.push(`A${r}:F${r}`);
 const cols=[8,34,...Array(16).fill(14)].map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
 const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
 const xf=(nf,fo,fi,b,al)=>`<xf numFmtId="${nf}" fontId="${fo}" fillId="${fi}" borderId="${b}" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>`;
 const st=`${X}<styleSheet xmlns="${NS}"><fonts count="3"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Arial"/></font><font><b/><sz val="11"/><name val="Arial"/></font></fonts><fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0B4F6C"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1E3A5F"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFD9E2F3"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="10"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xf(0,1,2,1)}${xf(0,1,3,1)}${xf(0,0,0,1)}${xf(4,0,0,1)}${xf(0,2,4,1)}${xf(4,2,4,1)}<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xf(0,0,0,1)}${xf(0,2,4,1)}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
 const sh=`${X}<worksheet xmlns="${NS}"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols>${cols}</cols><sheetData>${rows}</sheetData><mergeCells count="${mg.length}">${mg.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells><pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
 const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',PR_='http://schemas.openxmlformats.org/package/2006/relationships';
 return zip([
  ['[Content_Types].xml',`${X}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
  ['_rels/.rels',`${X}<Relationships xmlns="${PR_}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
  ['xl/workbook.xml',`${X}<workbook xmlns="${NS}" xmlns:r="${R}"><sheets><sheet name="BOQ" sheetId="1" r:id="rId1"/></sheets></workbook>`],
  ['xl/_rels/workbook.xml.rels',`${X}<Relationships xmlns="${PR_}"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`],
  ['xl/styles.xml',st],['xl/worksheets/sheet1.xml',sh]]);
