<meta charset="UTF-8">

<style>
:root{--bg:#060a16;--pn:#0d1530;--ln:#1f2d57;--tx:#e6ecff;--mu:#8b9ac7;--cy:#22d3ee;--vi:#a78bfa;--go:#fbbf24;--ok:#34d399;--in:#0a1126}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Cairo','Tajawal',sans-serif;background:var(--bg);color:var(--tx);padding-bottom:64px;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(900px 500px at 85% -10%,#1b2a6b66,transparent),radial-gradient(700px 500px at 0% 100%,#4c1d9555,transparent),var(--bg)}
.bg:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
.bg i{position:absolute;left:0;height:2px;width:55vw;border-radius:2px;opacity:0;animation:fly linear infinite}
@keyframes fly{0%{transform:translateX(-70vw) rotate(-14deg);opacity:0}12%{opacity:.9}88%{opacity:.9}100%{transform:translateX(150vw) rotate(-14deg);opacity:0}}
header{position:sticky;top:0;z-index:30;background:#070c1ce8;backdrop-filter:blur(12px);padding:10px 18px}
header:after,.foot:before{content:"";position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cy),var(--vi),var(--go),transparent);background-size:200% 100%;animation:slide 4s linear infinite}
header:after{bottom:0}.foot:before{top:0}
@keyframes slide{to{background-position:-200% 0}}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:46px;height:46px;filter:drop-shadow(0 0 8px var(--cy))}
h1{font-size:clamp(14px,2.2vw,21px);margin:0;font-weight:900;background:linear-gradient(90deg,#fff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.meta input{width:150px}
input,select{background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;font:600 13px 'Cairo';width:100%;min-width:62px;transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 3px #22d3ee33,0 0 14px #22d3ee55}
.btn{cursor:pointer;border:1px solid var(--ln);background:#101a3b;color:var(--tx);border-radius:10px;padding:8px 13px;font:700 13px 'Cairo';transition:.25s;position:relative;overflow:hidden}
.btn:hover{border-color:var(--cy);box-shadow:0 0 16px #22d3ee66;transform:translateY(-2px)}
.btn:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff40,transparent);transform:skewX(-20deg);transition:.6s}
.btn:hover:before{left:130%}
.btn.p{background:linear-gradient(135deg,#0891b2,#6d28d9);border-color:transparent}
.btn.d{color:#fb7185}.btn.s{padding:4px 9px;font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 18px;scrollbar-width:thin}
nav button{flex:none;cursor:pointer;color:var(--mu);background:transparent;border:1px solid transparent;border-radius:12px;padding:9px 14px;font:700 13px 'Cairo';position:relative;transition:.3s}
nav button:hover{color:#fff;background:#ffffff0d}
nav button.on{color:#fff;background:linear-gradient(135deg,#0e7490aa,#5b21b6aa);border-color:var(--cy);box-shadow:0 0 18px #22d3ee55,inset 0 0 12px #22d3ee22}
nav button.on:after{content:"";position:absolute;right:15%;left:15%;bottom:-2px;height:2px;background:var(--cy);box-shadow:0 0 10px var(--cy),0 0 22px var(--cy);border-radius:2px}
main{padding:0 18px 20px;max-width:1500px;margin:auto}
.panel{display:none}.panel.on{display:block;animation:in .55s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(-26px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.card{background:linear-gradient(160deg,#0f1a3d,#0a1230);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:16px;position:relative;box-shadow:0 10px 30px #0006}
h2{margin:0 0 12px;font-size:17px;color:var(--cy);display:flex;gap:8px;align-items:center}
h2:before{content:"";width:4px;height:20px;background:linear-gradient(var(--cy),var(--vi));border-radius:3px;box-shadow:0 0 10px var(--cy)}
.wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--ln)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{background:#131f4a;color:#b9c6f2;padding:9px 8px;font-weight:700;white-space:nowrap}
td{padding:5px;border-top:1px solid #16224a;text-align:center}
tbody tr{transition:.2s}tbody tr:hover{background:#22d3ee0f}
td.c{color:var(--go);font-weight:700;white-space:nowrap;padding:5px 10px}
tfoot td{background:#101b42;font-weight:900;color:var(--ok);padding:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.k{padding:16px;border-radius:16px;background:#0d1634;position:relative;overflow:hidden;border:1px solid var(--ln)}
.k:after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(100deg,transparent,#22d3ee22,transparent);animation:sh 5s infinite}
@keyframes sh{to{left:160%}}
.k b{display:block;font-size:26px;color:#fff;text-shadow:0 0 14px var(--cy)}
.k span{color:var(--mu);font-size:13px}
.k.t b{color:var(--go);text-shadow:0 0 14px var(--go)}
.kv{width:100%;min-width:0}.kv td{text-align:right;padding:7px 10px}.kv td:last-child{color:var(--go);font-weight:700;text-align:left}
.foot{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#070c1cf2;backdrop-filter:blur(10px);padding:10px 16px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;font-size:13px}
.foot a{color:var(--cy);text-decoration:none;font-weight:700;display:inline-flex;gap:5px;align-items:center}
.foot a:hover{text-shadow:0 0 10px var(--cy)}.foot a.w{color:#25d366}
#toast{position:fixed;top:84px;left:50%;transform:translate(-50%,-30px);background:#052e2b;border:1px solid var(--ok);color:#a7f3d0;padding:10px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.4s;z-index:99;box-shadow:0 0 22px #34d39966;font-weight:700}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pr{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
#rep{display:none;direction:rtl;color:#000;font-family:'Cairo',sans-serif;font-size:11pt}
@media print{
 @page{size:A4;margin:12mm 10mm 18mm}
 body{background:#fff;color:#000;padding:0}
 .bg,header,nav,main,#toast{display:none!important}
 #rep{display:block!important}
 #rep table{page-break-inside:auto}#rep tr{page-break-inside:avoid}#rep thead{display:table-header-group}
 .foot{background:#fff;color:#000;border-top:1px solid #000;backdrop-filter:none;padding:6px}.foot:before{display:none}.foot a,.foot a.w{color:#000}
}
</style>
</head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=(n,d=2)=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const KEY='boqpro_v1';
// ---------- خلفية الخيوط الضوئية ----------
(()=>{const b=$('#bg'),cl=['#22d3ee','#a78bfa','#fbbf24','#34d399'];for(let i=0;i<9;i++){const e=document.createElement('i'),c=cl[i%4];e.style.cssText=`top:${8+i*10}%;background:linear-gradient(90deg,transparent,${c},transparent);box-shadow:0 0 12px ${c};animation-duration:${6+Math.random()*7}s;animation-delay:${-Math.random()*12}s;width:${35+Math.random()*40}vw`;b.appendChild(e)}})();
// ---------- الإعدادات الافتراضية ----------
const PR=[['steel','سعر طن الحديد','طن',2800],['ready','سعر م³ خرسانة جاهزة','م³',300],['cement','سعر كيس الأسمنت (50كجم)','كيس',9],['sand','سعر م³ الرمل','م³',60],['gravel','سعر م³ الكري/الحصى','م³',70],['blk','سعر الألف بلك','ألف',1500],['exc','سعر م³ الحفر','م³',8],['fill','سعر م³ الردم والدمك','م³',6],['plaster','سعر م² اللياسة','م²',12],['paint','سعر م² الدهان','م²',6],['cf','سعر م² سيراميك أرضيات','م²',35],['cw','سعر م² سيراميك جدران','م²',35],['skirt','سعر م.ط الوزرات','م.ط',10],['wp','سعر م² العزل المائي','م²',18],['th','سعر م² العزل الحراري','م²',15]];
const PA=[['wSteel','نسبة هالك الحديد %',5],['wCon','نسبة هالك الخرسانة %',3],['wBlk','نسبة هالك البلك %',5],['swell','معامل الانتفاش',1.25],['comp','معامل الدمك (حجم الردم المفكوك)',1.15],['hRatio','نسبة الخرسانة الصافية في الهوردي',0.6],['hBlk','عدد بلوكات الهوردي / م²',9.6]];
const mkDef=()=>({meta:{proj:'',owner:'',date:new Date().toISOString().slice(0,10),area:200},
 par:Object.assign({cur:'ريال',mix:'site'},Object.fromEntries(PA.map(a=>[a[0],a[2]]))),
 pr:Object.fromEntries(PR.map(a=>[a[0],a[3]])),
 tb:{exc:[{name:'ح1',L:2,W:2,D:1.5,N:10}],con:[{name:'ق1',type:'قاعدة',grade:'C25',L:1.8,W:1.8,H:.5,N:10},{name:'ع1',type:'عمود',grade:'C25',L:.3,W:.3,H:3.2,N:10},{name:'س1',type:'سقف مصمت',grade:'C25',L:10,W:10,H:.15,N:1}],
 reb:[{el:'ق1',dia:16,len:12,n:20,cnt:10},{el:'ع1',dia:16,len:3.5,n:8,cnt:10},{el:'أساور',dia:8,len:1.2,n:25,cnt:10}],
 wall:[{name:'خارجي',L:40,H:3,th:20,N:1},{name:'داخلي',L:30,H:3,th:10,N:1}],open:[{name:'باب',W:.9,H:2.1,N:6},{name:'شباك',W:1.2,H:1.2,N:8}],
 fin:[{name:'صالة',type:'سيراميك أرضيات',L:6,W:5,N:1,ded:0},{name:'جدران',type:'دهان',L:70,W:3,N:1,ded:15}]}});
let S=mkDef(),LAST={};
// ---------- تعريف الجداول ----------
const CT=['قاعدة','لبشة/شداد','رقبة عمود','خرسانة عادية','عمود','جدار قص','كمرة','سقف مصمت','فلات سلاب','سقف هوردي'],BUR=['قاعدة','لبشة/شداد','رقبة عمود','خرسانة عادية'];
const MIX={C15:[5,.45,.9],C20:[6.5,.45,.9],C25:[7.5,.45,.9],C30:[8.5,.42,.84]},MF={10:.012,15:.018,20:.024};
const FT=['لياسة داخلية','لياسة خارجية','دهان','سيراميك أرضيات','سيراميك جدران','وزرات','عزل مائي','عزل حراري'],FK={'لياسة داخلية':'plaster','لياسة خارجية':'plaster','دهان':'paint','سيراميك أرضيات':'cf','سيراميك جدران':'cw','وزرات':'skirt','عزل مائي':'wp','عزل حراري':'th'};
const TB={
 exc:{t:'نماذج الحفر',cols:[['name','النموذج','t'],['L','الطول م','n'],['W','العرض م','n'],['D','العمق م','n'],['N','العدد','n']],out:[['vol','الحجم م³']],f:r=>({vol:r.L*r.W*r.D*r.N}),d:{name:'ح',L:1,W:1,D:1,N:1}},
 con:{t:'عناصر الخرسانة',cols:[['name','العنصر','t'],['type','النوع','s',CT],['grade','العيار','s',Object.keys(MIX)],['L','الطول م','n'],['W','العرض م','n'],['H','الارتفاع/السماكة م','n'],['N','العدد','n']],out:[['vol','الخرسانة الصافية م³'],['blk','عدد البلوكات']],f:r=>{const a=r.L*r.W*r.N,h=r.type=='سقف هوردي';return{vol:h?a*r.H*S.par.hRatio:a*r.H,blk:h?Math.ceil(a*S.par.hBlk):0}},d:{name:'',type:'قاعدة',grade:'C25',L:1,W:1,H:.5,N:1}},
 reb:{t:'جدول تفريد الحديد (BBS)',cols:[['el','العنصر الإنشائي','t'],['dia','القطر Φ','sn',[8,10,12,14,16,18,20,25,32]],['len','طول السيخ م','n'],['n','عدد الأسياخ بالعنصر','n'],['cnt','تكرار العنصر','n']],out:[['kg','الوزن كجم']],f:r=>({kg:r.dia*r.dia/162.2*r.len*r.n*r.cnt}),d:{el:'',dia:12,len:1,n:1,cnt:1}},
 wall:{t:'الجدران',cols:[['name','الجدار','t'],['L','الطول م','n'],['H','الارتفاع م','n'],['th','السمك سم','sn',[10,15,20]],['N','العدد','n']],out:[['area','المساحة م²']],f:r=>({area:r.L*r.H*r.N}),d:{name:'',L:1,H:3,th:20,N:1}},
 open:{t:'فتحات الأبواب والشبابيك (تُخصم تلقائياً)',cols:[['name','الفتحة','t'],['W','العرض م','n'],['H','الارتفاع م','n'],['N','العدد','n']],out:[['area','المساحة م²']],f:r=>({area:r.W*r.H*r.N}),d:{name:'',W:1,H:1,N:1}},
 fin:{t:'بنود التشطيبات',cols:[['name','الموقع/البند','t'],['type','نوع العمل','s',FT],['L','الطول م','n'],['W','العرض/الارتفاع م','n'],['N','العدد','n'],['ded','خصم فتحات م²','n']],out:[['qty','الكمية'],['u','الوحدة']],f:r=>{const s=r.type=='وزرات';return{qty:s?r.L*r.N:Math.max(0,r.L*r.W*r.N-r.ded),u:s?'م.ط':'م²'}},d:{name:'',type:'لياسة داخلية',L:1,W:1,N:1,ded:0}}
};
const TABS=[['pr','0. الأسعار والمعاملات'],['exc','1. الأعمال الترابية'],['con','2. الخرسانة'],['reb','3. حديد التسليح'],['wall','4. المباني'],['fin','5. التشطيبات'],['boq','6. جدول الكميات النهائي']];
// ---------- بناء الواجهة ----------
const esc=v=>String(v??'').replace(/"/g,'&quot;');
function cell(t,i,c,v){const [k,,ty,o]=c,a=`data-t="${t}" data-i="${i}" data-k="${k}" data-ty="${ty}"`;if(ty[0]=='s')return`<select ${a}>${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;return`<input ${a} ${ty=='n'?'type="number" step="any" min="0"':''} value="${esc(v)}">`}
function renderT(t){const T=TB[t];$('#tb-'+t).innerHTML=`<table><thead><tr><th>#</th>${T.cols.map(c=>`<th>${c[1]}</th>`).join('')}${T.out.map(o=>`<th>${o[1]}</th>`).join('')}<th>إجراءات</th></tr></thead><tbody>${S.tb[t].map((r,i)=>`<tr data-t="${t}" data-i="${i}"><td>${i+1}</td>${T.cols.map(c=>`<td>${cell(t,i,c,r[c[0]])}</td>`).join('')}${T.out.map(o=>`<td class="c" data-f="${o[0]}">0</td>`).join('')}<td style="white-space:nowrap"><button class="btn s" data-a="cp" data-t="${t}" data-i="${i}">نسخ</button> <button class="btn s d" data-a="rm" data-t="${t}" data-i="${i}">حذف</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="${T.cols.length+1}">الإجمالي</td>${T.out.map(o=>`<td id="tot-${t}-${o[0]}"></td>`).join('')}<td></td></tr></tfoot></table>`;calc()}
const sec=(t,id,extra='')=>`<div class="card"><h2>${t}</h2><div class="wrap" id="tb-${id}"></div><div style="margin-top:10px"><button class="btn p" data-a="add" data-t="${id}">+ إضافة بند / عنصر جديد</button></div>${extra}</div>`;
function build(){
 $('#nav').innerHTML=TABS.map((t,i)=>`<button data-tab="${t[0]}" class="${i?'':'on'}">${t[1]}</button>`).join('');
 const inp=(g,k,l,v,ty='n')=>`<div class="fld"><label>${l}</label><input data-g="${g}" data-k="${k}" data-ty="${ty}" ${ty=='n'?'type="number" step="any"':''} value="${esc(v)}"></div>`;
 $('#main').innerHTML=`
 <section class="panel on" id="p-pr"><div class="card"><h2>العملة والأسعار</h2><div class="grid g2"><div class="fld"><label>العملة</label><select data-g="par" data-k="cur" data-ty="s">${['ريال','دولار','جنيه','درهم','دينار'].map(x=>`<option ${x==S.par.cur?'selected':''}>${x}</option>`).join('')}</select></div><div class="fld"><label>طريقة الخرسانة</label><select data-g="par" data-k="mix" data-ty="s"><option value="site" ${S.par.mix=='site'?'selected':''}>خلط بالموقع (أسمنت + رمل + كري)</option><option value="ready" ${S.par.mix=='ready'?'selected':''}>خرسانة جاهزة</option></select></div>${PR.map(a=>inp('pr',a[0],`${a[1]} / ${a[2]}`,S.pr[a[0]])).join('')}</div></div>

function calc(){
 const P=S.par,pr=S.pr,C={},T={};
 for(const t in TB){C[t]=S.tb[t].map(r=>TB[t].f(r));T[t]={};TB[t].out.forEach(([k])=>{T[t][k]=C[t].reduce((s,c)=>s+(typeof c[k]=='number'?c[k]:0),0)})}
 $$('tr[data-t]').forEach(tr=>{const c=(C[tr.dataset.t]||[])[tr.dataset.i]||{};tr.querySelectorAll('[data-f]').forEach(td=>{const v=c[td.dataset.f];td.textContent=typeof v=='number'?fmt(v,3):v})});
 for(const t in TB)TB[t].out.forEach(([k])=>{const e=$(`#tot-${t}-${k}`);if(e&&t!='fin')e.textContent=fmt(T[t][k],k=='blk'?0:3)});
 const cur=P.cur,B=[];let n=0;const add=(d,u,q,p)=>{if(q>0)B.push([++n,d,u,q,p,q*p])};
 // ترابية
 const ex=T.exc.vol,bur=C.con.reduce((s,c,i)=>s+(BUR.includes(S.tb.con[i].type)?c.vol:0),0),net=Math.max(0,ex-bur),loose=net*P.comp,surplus=Math.max(0,ex*P.swell-loose);
 $('#s-exc').innerHTML=kv([['إجمالي الحفر م³',fmt(ex)],['خرسانة مدفونة (قواعد/لبشة/رقاب/عادية) م³',fmt(bur)],['صافي الردم م³',fmt(net)],['حجم الردم بعد معامل الدمك م³',fmt(loose)],['الحفر بعد الانتفاش م³',fmt(ex*P.swell)],['ناتج فائض للترحيل م³',fmt(surplus)]]);
 add('أعمال الحفر','م³',ex,pr.exc);add('أعمال الردم والدمك','م³',loose,pr.fill);
 // خرسانة
 const G={};C.con.forEach((c,i)=>{const g=S.tb.con[i].grade;G[g]=(G[g]||0)+c.vol});
 let cem=0,sd=0,gr=0,cc=0,cv=0,rows=[];
 for(const g in G){const v=G[g]*(1+P.wCon/100),m=MIX[g];cv+=v;const a=v*m[0],b=v*m[1],d=v*m[2];cem+=a;sd+=b;gr+=d;cc+=P.mix=='ready'?v*pr.ready:a*pr.cement+b*pr.sand+d*pr.gravel;rows.push([`عيار ${g}: خرسانة شاملة الهالك م³`,fmt(v)],[`— أكياس أسمنت`,Math.ceil(a)],[`— رمل م³`,fmt(b)],[`— كري م³`,fmt(d)])}
 $('#s-con').innerHTML=kv([['إجمالي الخرسانة الصافية م³',fmt(T.con.vol)],['إجمالي عدد بلوكات الهوردي',fmt(T.con.blk,0)],...rows]);
 if(cv)add(P.mix=='ready'?'خرسانة جاهزة (شاملة الهالك)':'خرسانة بالموقع: أسمنت + رمل + كري','م³',cv,cc/cv);
 add('بلوك هوردي للأسقف','قطعة',T.con.blk*(1+P.wBlk/100),pr.blk/1000);
 // حديد
 const D={};C.reb.forEach((c,i)=>{const d=S.tb.reb[i].dia;D[d]=(D[d]||0)+c.kg});let st=0,sr=[];
 Object.keys(D).sort((a,b)=>a-b).forEach(d=>{const k=D[d],kw=k*(1+P.wSteel/100);st+=kw;sr.push([`Φ${d} مم (صافي ${fmt(k)} كجم)`,`${fmt(kw)} كجم = ${fmt(kw/1000,3)} طن`]);add(`حديد تسليح Φ${d} مم (شامل الهالك)`,'طن',kw/1000,pr.steel)});
 $('#s-reb').innerHTML=kv([...sr,['الإجمالي شامل الهالك',`${fmt(st)} كجم = ${fmt(st/1000,3)} طن`]]);
 // مباني
 const gr0=T.wall.area,op=T.open.area,na=Math.max(0,gr0-op),ra=gr0?na/gr0:0,bl=na*12.5*(1+P.wBlk/100),mo=ra*C.wall.reduce((s,c,i)=>s+c.area*(MF[S.tb.wall[i].th]||0),0);

 add('بناء جدران بلك (توريد وتركيب)','قطعة',bl,pr.blk/1000);add('أسمنت مونة البناء','كيس',Math.ceil(mo*6),pr.cement);add('رمل مونة البناء','م³',mo*1.1,pr.sand);
 // تشطيبات
 const F={};C.fin.forEach((c,i)=>{const t=S.tb.fin[i].type;F[t]=(F[t]||[0,c.u]);F[t][0]+=c.qty});
 $('#s-fin').innerHTML=kv(Object.keys(F).map(t=>[t,`${fmt(F[t][0])} ${F[t][1]}`]));
 FT.forEach(t=>{if(F[t])add(t,F[t][1],F[t][0],pr[FK[t]])});
 const tot=B.reduce((s,r)=>s+r[5],0),ar=+S.meta.area||0;
 $('#boq').innerHTML=`<thead><tr><th>رقم البند</th><th>بيان الأعمال</th><th>الوحدة</th><th>الكمية الإجمالية</th><th>سعر الوحدة (${cur})</th><th>الإجمالي (${cur})</th></tr></thead><tbody>${B.map(r=>`<tr><td>${r[0]}</td><td style="text-align:right">${r[1]}</td><td>${r[2]}</td><td>${fmt(r[3])}</td><td>${fmt(r[4])}</td><td class="c">${fmt(r[5])}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="5">المجموع الكلي للمشروع (${cur})</td><td>${fmt(tot)}</td></tr></tfoot>`;
 $('#kpi').innerHTML=[['إجمالي الخرسانة م³',fmt(T.con.vol),''],['إجمالي الحديد (طن)',fmt(st/1000,3),''],['إجمالي حفر م³',fmt(ex),''],['التكلفة التقديرية / م² ('+cur+')',ar?fmt(tot/ar):'—','t'],['التكلفة الكلية ('+cur+')',fmt(tot),'t']].map(k=>`<div class="k ${k[2]}"><span>${k[0]}</span><b>${k[1]}</b></div>`).join('');

function report(x){
 const m=S.meta,cur=S.par.cur,

 D='border:1px solid #000;padding:4px;text-align:center',

 dom=id=>$$('#'+id+' tr').map(tr=>[...tr.children].map(td=>td.textContent)),
 out=[];
 out.push(tbl('المنظومة الهندسية لحساب الكميات والمواصفات (BOQ Pro)',['المشروع','المالك','تاريخ الحصر','مساحة البناء م²'],[[esc(m.proj)||'—',esc(m.owner)||'—',esc(m.date),nm(+m.area||0)]]));

function zip(files){
 const te=new TextEncoder(),T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}
 const crc=b=>{let c=-1;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
 const parts=[],cd=[];let off=0;
 files.forEach(([name,str])=>{const nb=te.encode(name),d=te.encode(str),cr=crc(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x5821,true);h.setUint32(14,cr,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),nb,d);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x5821,true);c.setUint32(16,cr,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
  cd.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+d.length});
 const cs=cd.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function buildXlsx(TM){

 row(['تصميم وبرمجة: EngAMER  |  للتواصل والاستشارات الهندسية والبرمجية: +967777136380','','','','',''],'f',24);mg.push(`A${r}:F${r}`);
 const cols=[8,34,...Array(8).fill(18)].map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
 const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';

 const sh=`${X}<worksheet xmlns="${NS}"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols>${cols}</cols><sheetData>${rows}</sheetData><mergeCells count="${mg.length}">${mg.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells><pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
 const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',PR_='http://schemas.openxmlformats.org/package/2006/relationships';
 return zip([

  ['xl/workbook.xml',`${X}<workbook xmlns="${NS}" xmlns:r="${R}"><sheets><sheet name="BOQ" sheetId="1" r:id="rId1"/></sheets></workbook>`],
