<style>
:root{--bg:#060a16;--pn:#0d1530;--ln:#1f2d57;--tx:#e6ecff;--mu:#8b9ac7;--cy:#22d3ee;--vi:#a78bfa;--go:#fbbf24;--ok:#34d399;--in:#0a1126}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Cairo','Tajawal',sans-serif;background:var(--bg);color:var(--tx);padding-bottom:64px;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(900px 500px at 85% -10%,#1b2a6b66,transparent),radial-gradient(700px 500px at 0% 100%,#4c1d9555,transparent),var(--bg)}
.bg:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
.bg i{position:absolute;left:0;height:2px;width:55vw;border-radius:2px;opacity:0;animation:fly linear infinite}
@keyframes fly{0%{transform:translateX(-70vw) rotate(-14deg);opacity:0}12%{opacity:.9}88%{opacity:.9}100%{transform:translateX(150vw) rotate(-14deg);opacity:0}}
header{position:sticky;top:0;z-index:30;background:#070c1ce8;backdrop-filter:blur(12px);padding:10px 18px}
header:after,.foot:before{content:"";position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cy),var(--vi),var(--go),transparent);background-size:200% 100%;animation:slide 4s linear infinite}
header:after{bottom:0}.foot:before{top:0}
@keyframes slide{to{background-position:-200% 0}}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

.logo{width:46px;height:46px;filter:drop-shadow(0 0 8px var(--cy))}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.meta input{width:150px}
input,select{background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;font:600 13px 'Cairo';width:100%;min-width:62px;transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 3px #22d3ee33,0 0 14px #22d3ee55}

.btn:hover{border-color:var(--cy);box-shadow:0 0 16px #22d3ee66;transform:translateY(-2px)}
.btn:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff40,transparent);transform:skewX(-20deg);transition:.6s}
.btn:hover:before{left:130%}
.btn.p{background:linear-gradient(135deg,#0891b2,#6d28d9);border-color:transparent}
.btn.d{color:#fb7185}.btn.s{padding:4px 9px;font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 18px;scrollbar-width:thin}
nav button{flex:none;cursor:pointer;color:var(--mu);background:transparent;border:1px solid transparent;border-radius:12px;padding:9px 14px;font:700 13px 'Cairo';position:relative;transition:.3s}
nav button:hover{color:#fff;background:#ffffff0d}
nav button.on{color:#fff;background:linear-gradient(135deg,#0e7490aa,#5b21b6aa);border-color:var(--cy);box-shadow:0 0 18px #22d3ee55,inset 0 0 12px #22d3ee22}
nav button.on:after{content:"";position:absolute;right:15%;left:15%;bottom:-2px;height:2px;background:var(--cy);box-shadow:0 0 10px var(--cy),0 0 22px var(--cy);border-radius:2px}
main{padding:0 18px 20px;max-width:1500px;margin:auto}
.panel{display:none}.panel.on{display:block;animation:in .55s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(-26px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.card{background:linear-gradient(160deg,#0f1a3d,#0a1230);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:16px;position:relative;box-shadow:0 10px 30px #0006}
h2{margin:0 0 12px;font-size:17px;color:var(--cy);display:flex;gap:8px;align-items:center}

.wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--ln)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{background:#131f4a;color:#b9c6f2;padding:9px 8px;font-weight:700;white-space:nowrap}
td{padding:5px;border-top:1px solid #16224a;text-align:center}
tbody tr{transition:.2s}tbody tr:hover{background:#22d3ee0f}
td.c{color:var(--go);font-weight:700;white-space:nowrap;padding:5px 10px}
tfoot td{background:#101b42;font-weight:900;color:var(--ok);padding:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.k{padding:16px;border-radius:16px;background:#0d1634;position:relative;overflow:hidden;border:1px solid var(--ln)}
.k:after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(100deg,transparent,#22d3ee22,transparent);animation:sh 5s infinite}
@keyframes sh{to{left:160%}}
.k b{display:block;font-size:26px;color:#fff;text-shadow:0 0 14px var(--cy)}
.k span{color:var(--mu);font-size:13px}
.k.t b{color:var(--go);text-shadow:0 0 14px var(--go)}
.kv{width:100%;min-width:0}.kv td{text-align:right;padding:7px 10px}.kv td:last-child{color:var(--go);font-weight:700;text-align:left}

#toast{position:fixed;top:84px;left:50%;transform:translate(-50%,-30px);background:#052e2b;border:1px solid var(--ok);color:#a7f3d0;padding:10px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.4s;z-index:99;box-shadow:0 0 22px #34d39966;font-weight:700}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* الوضع الفاتح */
:root[data-theme=light]{--bg:#eef2fa;--pn:#fff;--ln:#c9d4ea;--tx:#101c3a;--mu:#51618a;--cy:#0b7285;--vi:#6d28d9;--go:#b45309;--ok:#047857;--in:#fff;color-scheme:light}

.pr{display:none}

#rep{display:none;direction:rtl;color:#000;font-family:'Cairo',sans-serif;font-size:11pt}

$('#bPrint').onclick=()=>{
 try{const html=report(model());if(!html)throw new Error('لم يتم إنشاء محتوى التقرير');$('#rep').innerHTML=html;toast('اختر طباعة أو حفظ بصيغة PDF من نافذة الطباعة');window.print()}
 catch(err){console.error('Print error:',err);toast('تعذر تجهيز التقرير للطباعة: '+(err.message||err))}
};
$('#bXls').onclick=()=>{
 try{const data=model();if(!Array.isArray(data)||!data.length)throw new Error('لا توجد بيانات للتصدير');const blob=buildXlsx(data);if(!blob||!blob.size)throw new Error('تعذر إنشاء ملف Excel');const safeName=(S.meta.proj||'BOQ-Full').replace(/[\\/:*?"<>|]/g,'-');dl(blob,safeName+'.xlsx')}
 catch(err){console.error('Excel export error:',err);toast('تعذر تصدير Excel: '+(err.message||err))}
};
try{const s=localStorage.getItem(KEY)||localStorage.getItem('boqpro_v1');if(s){const o=JSON.parse(s),d=mkDef();if(o.tb&&(o.par||o.pr)){S={meta:{...d.meta,...o.meta},mix:{...d.mix,...(o.mix||{})},pr:{...d.pr,...(o.pr||{})},px:o.px||{},par:{...d.par,...(o.par||{})},tb:{...d.tb,...o.tb}};S.tb.con.forEach(r=>{r.grade=({C15:'17',C20:'21',C25:'25',C30:'30'})[r.grade]||r.grade})}}}catch(x){}
applyTheme();build();bindMeta();

const xe=s=>String(s).replace(/&quot;/g,'"').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const colL=i=>String.fromCharCode(65+i);
function zip(files){
 const te=new TextEncoder(),T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}
 const crc=b=>{let c=-1;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
 const parts=[],cd=[];let off=0;
 files.forEach(([name,str])=>{const nb=te.encode(name),d=te.encode(str),cr=crc(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x5821,true);h.setUint32(14,cr,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),nb,d);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x5821,true);c.setUint32(16,cr,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
  cd.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+d.length});
 const cs=cd.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function buildXlsx(TM){
 let rows='',mg=[],r=0;
 const cell=(c,v,k)=>{if(typeof v=='string'&&v!==''&&/^-?[\d,]*\.?\d+$/.test(v)&&!/^0\d/.test(v))v=Number(v.replace(/,/g,''));
  const n=typeof v=='number'&&isFinite(v),f=n&&!Number.isInteger(v),s=k=='t'?1:k=='h'?2:k=='b'?(n?(f?4:8):3):(n?(f?6:9):5),ref=colL(c)+r;
  return n?`<c r="${ref}" s="${s}"><v>${v}</v></c>`:(v===''||v==null)?`<c r="${ref}" s="${s}"/>`:`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`};
 const row=(a,k,h)=>{r++;rows+=`<row r="${r}"${h?` ht="${h}" customHeight="1"`:''}>${a.map((v,c)=>cell(c,v,k)).join('')}</row>`};
 TM.forEach(t=>{const w=t.head.length;row([t.title,...Array(w-1).fill('')],'t',26);if(w>1)mg.push(`A${r}:${colL(w-1)}${r}`);row(t.head,'h',22);t.rows.forEach(a=>row(a,'b'));if(t.foot)row(t.foot,'f');r++});
 row(['تصميم وبرمجة: م/عبدالرحمن عامر  |  للتواصل والاستشارات الهندسية والبرمجية: +967777136380','','','','',''],'f',24);mg.push(`A${r}:F${r}`);
 const cols=[8,34,...Array(16).fill(14)].map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
 const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
 const xf=(nf,fo,fi,b,al)=>`<xf numFmtId="${nf}" fontId="${fo}" fillId="${fi}" borderId="${b}" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>`;
 const st=`${X}<styleSheet xmlns="${NS}"><fonts count="3"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Arial"/></font><font><b/><sz val="11"/><name val="Arial"/></font></fonts><fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0B4F6C"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1E3A5F"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFD9E2F3"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="10"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xf(0,1,2,1)}${xf(0,1,3,1)}${xf(0,0,0,1)}${xf(4,0,0,1)}${xf(0,2,4,1)}${xf(4,2,4,1)}<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xf(0,0,0,1)}${xf(0,2,4,1)}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
 const sh=`${X}<worksheet xmlns="${NS}"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols>${cols}</cols><sheetData>${rows}</sheetData><mergeCells count="${mg.length}">${mg.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells><pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
 const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',PR_='http://schemas.openxmlformats.org/package/2006/relationships';
 return zip([
  ['[Content_Types].xml',`${X}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
  ['_rels/.rels',`${X}<Relationships xmlns="${PR_}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
  ['xl/workbook.xml',`${X}<workbook xmlns="${NS}" xmlns:r="${R}"><sheets><sheet name="BOQ" sheetId="1" r:id="rId1"/></sheets></workbook>`],
  ['xl/_rels/workbook.xml.rels',`${X}<Relationships xmlns="${PR_}"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`],
  ['xl/styles.xml',st],['xl/worksheets/sheet1.xml',sh]]);
}
